<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">

    <!-- Logo + toggle -->
    <div class="sidebar-header">
      <div class="logo" *ngIf="sidebarOpen">
        <mat-icon class="logo-icon">support_agent</mat-icon>
        <span class="logo-text">GPRO Support</span>
      </div>
      <button mat-icon-button (click)="toggleSidebar()" class="toggle-btn">
        <mat-icon>{{ sidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="nav-active"
         class="nav-item"
         [matTooltip]="!sidebarOpen ? item.label : ''"
         matTooltipPosition="right">
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Pied de sidebar -->
    <div class="sidebar-footer">
      <!-- Toggle thème -->
      <button mat-icon-button (click)="theme.toggle()"
              [matTooltip]="theme.isDarkMode() ? 'Mode clair' : 'Mode sombre'"
              matTooltipPosition="right" class="footer-btn">
        <mat-icon>{{ theme.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- Déconnexion -->
      <button mat-icon-button (click)="logout()"
              matTooltip="Déconnexion" matTooltipPosition="right" class="footer-btn logout-btn">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

  </aside>

  <!-- ===== CONTENU PRINCIPAL ===== -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="page-breadcrumb"></span>
      </div>
      <div class="topbar-right">
        <div class="user-info">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name" *ngIf="user">{{ user.nom }}</span>
          <span class="role-badge">{{ user?.role }}</span>
        </div>
      </div>
    </header>

    <!-- Page content via router -->
    <div class="content-area">
      <router-outlet />
    </div>

  </div>
</div>
