<div class="page-header flex-between" style="margin-bottom:20px">
  <h2 style="margin:0;font-size:20px;font-weight:700">
    <mat-icon style="color:#66bb6a;vertical-align:middle">people</mat-icon> Clients — Parc
  </h2>
  <button mat-raised-button color="primary" (click)="openDialog()">
    <mat-icon>person_add</mat-icon> Nouveau client
  </button>
</div>

<div *ngIf="loading" style="display:flex;justify-content:center;padding:40px">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div class="card" style="padding:0;overflow:hidden" *ngIf="!loading">
  <div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-muted)">
    {{ clients.length }} client(s)
  </div>

  <table mat-table [dataSource]="clients" class="gpro-table">

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Client</th>
      <td mat-cell *matCellDef="let c"><strong>{{ c.nom }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let c">{{ c.email || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="projet">
      <th mat-header-cell *matHeaderCellDef>Projet ERP</th>
      <td mat-cell *matCellDef="let c">{{ c.projetNom }}</td>
    </ng-container>

    <ng-container matColumnDef="versionActive">
      <th mat-header-cell *matHeaderCellDef>Version active</th>
      <td mat-cell *matCellDef="let c">
        <code class="version-chip">v{{ c.versionActiveCode }}</code>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button (click)="openDialog(c)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="delete(c.id)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>

  <div *ngIf="clients.length === 0" style="text-align:center;padding:40px;color:var(--text-muted)">
    <mat-icon style="font-size:40px;display:block;margin:0 auto 8px">people_outline</mat-icon>
    <p>Aucun client.</p>
  </div>
</div>
