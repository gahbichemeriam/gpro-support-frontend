<div class="page-header flex-between" style="margin-bottom:20px">
  <h2 style="margin:0;font-size:20px;font-weight:700">
    <mat-icon style="color:#7986cb;vertical-align:middle">extension</mat-icon> Modules ERP
  </h2>
  <button mat-raised-button color="primary" (click)="openForm()" *ngIf="role.canEdit()">
    <mat-icon>add</mat-icon> Nouveau module
  </button>
</div>

<!-- Formulaire -->
<div class="form-panel card" *ngIf="showForm" style="margin-bottom:16px">
  <h3 style="margin:0 0 16px;font-size:16px;font-weight:600">{{ editMode ? 'Modifier' : 'Nouveau module' }}</h3>
  <form [formGroup]="form" (ngSubmit)="save()" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <mat-form-field appearance="outline">
      <mat-label>Projet ERP</mat-label>
      <mat-select formControlName="projetId">
        <mat-option *ngFor="let p of projets" [value]="p.id">{{ p.nom }}</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nom du module</mat-label>
      <input matInput formControlName="nom" placeholder="Production">
    </mat-form-field>
    <mat-form-field appearance="outline" style="grid-column:1/-1">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>
    <div style="grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px">
      <button mat-button type="button" (click)="cancel()">Annuler</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
        {{ editMode ? 'Mettre à jour' : 'Créer' }}
      </button>
    </div>
  </form>
</div>

<!-- Loading -->
<div *ngIf="loading" style="display:flex;justify-content:center;padding:40px">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<!-- Table -->
<div class="card" style="padding:0;overflow:hidden" *ngIf="!loading">
  <table mat-table [dataSource]="modules" style="width:100%;background:transparent">

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Nom</th>
      <td mat-cell *matCellDef="let m"><strong>{{ m.nom }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Description</th>
      <td mat-cell *matCellDef="let m">{{ m.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="projet">
      <th mat-header-cell *matHeaderCellDef style="color:var(--text-muted);font-size:11px;text-transform:uppercase">Projet</th>
      <td mat-cell *matCellDef="let m">{{ m.projetNom }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let m">
        <button mat-icon-button (click)="openForm(m)" *ngIf="role.canEdit()"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="delete(m.id)" *ngIf="role.isAdmin()"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>

  <div *ngIf="modules.length === 0" style="text-align:center;padding:40px;color:var(--text-muted)">
    <mat-icon style="font-size:40px;display:block;margin:0 auto 8px">extension_off</mat-icon>
    <p>Aucun module.</p>
  </div>
</div>
