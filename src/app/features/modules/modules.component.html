<div class="page-header flex-between" style="margin-bottom:20px">
  <h2 style="margin:0;font-size:20px;font-weight:700"><mat-icon style="color:#7986cb;vertical-align:middle">extension</mat-icon> Modules ERP</h2>
  <button mat-raised-button color="primary" (click)="openDialog()" *ngIf="role.canEdit()"><mat-icon>add</mat-icon> Nouveau module</button>
</div>

<div *ngIf="loading" style="display:flex;justify-content:center;padding:40px"><mat-spinner diameter="40"></mat-spinner></div>

<div class="card" style="padding:0;overflow:hidden" *ngIf="!loading">
  <table mat-table [dataSource]="modules" class="gpro-table">
    <ng-container matColumnDef="nom"><th mat-header-cell *matHeaderCellDef>Nom</th><td mat-cell *matCellDef="let m"><strong>{{ m.nom }}</strong></td></ng-container>
    <ng-container matColumnDef="description"><th mat-header-cell *matHeaderCellDef>Description</th><td mat-cell *matCellDef="let m">{{ m.description || '—' }}</td></ng-container>
    <ng-container matColumnDef="projet"><th mat-header-cell *matHeaderCellDef>Projet</th><td mat-cell *matCellDef="let m">{{ m.projetNom }}</td></ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let m">
        <button mat-icon-button (click)="openDialog(m)" *ngIf="role.canEdit()"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="delete(m.id)" *ngIf="role.isAdmin()"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>
  <div *ngIf="modules.length === 0" style="text-align:center;padding:40px;color:var(--text-muted)"><mat-icon style="font-size:40px;display:block;margin:0 auto 8px">extension_off</mat-icon><p>Aucun module.</p></div>
</div>
