<div class="page-header flex-between" style="margin-bottom:20px">
  <h2 class="page-title">
    <mat-icon style="color:#7986cb;vertical-align:middle">business</mat-icon> Projets ERP
  </h2>
  <button mat-raised-button color="primary" (click)="openDialog()" *ngIf="role.canManageProjects()">
    <mat-icon>add</mat-icon> Nouveau projet
  </button>
</div>

<div class="loading-wrap" *ngIf="loading">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<div class="card" style="padding:0;overflow:hidden" *ngIf="!loading">
  <div style="padding:14px 20px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-muted)">
    {{ projets.length }} projet(s)
  </div>

  <table mat-table [dataSource]="projets" class="gpro-table">

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let p"><strong>{{ p.nom }}</strong></td>
    </ng-container>

    <ng-container matColumnDef="codeProduit">
      <th mat-header-cell *matHeaderCellDef>Code Produit</th>
      <td mat-cell *matCellDef="let p">
        <code class="code-chip">{{ p.codeProduit }}</code>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let p">{{ p.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button (click)="openDialog(p)" *ngIf="role.canManageProjects()">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(p.id)" *ngIf="role.canManageProjects()">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>

  <div class="empty" *ngIf="projets.length === 0">
    <mat-icon>business_center</mat-icon>
    <p>Aucun projet. Créez-en un !</p>
  </div>
</div>
